<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班味人格鉴定所 · 同人复刻</title>
<style>
:root{
  --bg:#0a0a0b;
  --panel:#111113;
  --line:rgba(201,166,107,.20);
  --line-strong:rgba(201,166,107,.45);
  --gold:#c9a66b;
  --gold-hi:#eed3a0;
  --ink:#d8d2c6;
  --muted:#8e887c;
  --dim:#5c574f;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 700px at 72% -8%, rgba(80,58,28,.16) 0%, transparent 55%),
    radial-gradient(900px 620px at 6% 108%, rgba(46,48,58,.16) 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
}
::selection{background:rgba(201,166,107,.28)}
.wrap{width:min(1180px,94vw);margin:0 auto;padding:36px 0 48px;display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding-top:22px}}

/* ---------- 左侧 ---------- */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:24px}
@media(max-width:900px){.side{position:static}}
.logo-card{position:relative;border:1px solid var(--line-strong);background:linear-gradient(180deg,#151210,#0e0d0c);padding:27px 20px 22px;text-align:center}
.logo-card::before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,166,107,.14);pointer-events:none}
.logo{margin:0;font-family:var(--serif);font-weight:600;font-size:33px;letter-spacing:.16em;text-indent:.16em;background:linear-gradient(180deg,var(--gold-hi),#b8904f);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-sub{margin-top:10px;font-size:9px;letter-spacing:.42em;text-indent:.42em;color:var(--muted)}
.logo-tag{position:absolute;top:9px;right:9px;font-size:10px;color:var(--dim);border:1px solid rgba(255,255,255,.09);padding:1px 6px;letter-spacing:.18em}
.anniv-card{border:1px solid var(--line);background:linear-gradient(180deg,#121214,#0f0f11);padding:19px 22px;text-align:center}
.anniv-title{font-family:var(--serif);font-size:23px;letter-spacing:.3em;text-indent:.3em;color:#cfc7b8}
.anniv-sub{margin-top:7px;font-size:9.5px;letter-spacing:.4em;text-indent:.4em;color:var(--dim)}
.specs{border:1px solid var(--line);background:var(--panel);padding:4px 18px}
.spec-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:13px}
.spec-row:last-child{border-bottom:none}
.spec-row span{color:var(--muted);letter-spacing:.12em}
.spec-row b{font-weight:500;color:var(--ink);letter-spacing:.08em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.ghost.wide{width:100%;border:1px solid var(--line);background:#101012;color:var(--ink);padding:12px;letter-spacing:.22em;text-indent:.22em;font-size:13px;transition:.2s}
.ghost.wide:hover{border-color:var(--line-strong);color:var(--gold-hi)}
.holder{margin-top:2px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:0 4px;letter-spacing:.06em}
.heart{color:#b3574a}

/* ---------- 主面板 ---------- */
.main .panel{border:1px solid var(--line);background:linear-gradient(180deg,#121214,#0e0e10);min-height:740px;display:flex;flex-direction:column;position:relative}
.panel::before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,166,107,.07);pointer-events:none}
.panel-head{display:flex;align-items:center;gap:8px;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;color:var(--muted);letter-spacing:.12em}
.dot{width:7px;height:7px;border-radius:50%;background:#b3574a;box-shadow:0 0 6px rgba(179,87,74,.7);flex:0 0 auto}
.head-right{margin-left:auto;letter-spacing:.3em;font-size:10px;color:var(--dim)}
.panel-body{padding:30px 32px;flex:1;position:relative}
@media(max-width:640px){.panel-body{padding:22px 18px}}
.panel-foot{padding:12px 22px;font-size:11px;color:var(--dim);letter-spacing:.1em;border-top:1px solid rgba(255,255,255,.04);text-align:center}
.screen-anim{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 起始屏 */
.kicker{font-size:11px;letter-spacing:.35em;color:var(--gold)}
.start h2{font-family:var(--serif);font-size:31px;letter-spacing:.1em;margin:14px 0 12px;color:#e3dccd;font-weight:600;line-height:1.5}
.start .lead{color:var(--muted);line-height:1.95;font-size:14px;max-width:640px;margin:0}
.name-row{margin:30px 0 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.name-row label{font-size:13px;color:var(--muted);letter-spacing:.16em}
.name-input{background:#0c0c0e;border:1px solid var(--line);color:var(--ink);padding:10px 14px;font-size:14px;letter-spacing:.08em;width:220px;outline:none;font-family:inherit;transition:.2s}
.name-input:focus{border-color:var(--line-strong)}
.btn-primary{background:linear-gradient(180deg,#e8c98f,#c39a58);color:#171208;padding:13px 34px;font-size:14px;font-weight:600;letter-spacing:.22em;text-indent:.22em;transition:.2s}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:active{transform:translateY(1px)}
.start-note{margin-top:28px;font-size:12px;color:var(--dim);line-height:1.9}

/* 答题屏 */
.progress{height:2px;background:rgba(255,255,255,.06);margin:20px 0 28px;position:relative;overflow:hidden}
.progress i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a6a3a,var(--gold-hi));width:0;transition:width .3s ease}
.q-index{font-size:11px;color:var(--dim);letter-spacing:.32em}
.q-text{font-family:var(--serif);font-size:22px;line-height:1.8;margin:12px 0 26px;letter-spacing:.04em;color:#e6dfd2}
@media(max-width:640px){.q-text{font-size:19px}}
.options{display:flex;flex-direction:column;gap:12px}
.option{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.08);background:#131316;padding:15px 16px;transition:.18s;color:var(--ink)}
.option:hover{border-color:var(--line-strong);background:#161519;transform:translateX(3px)}
.option .letter{flex:0 0 26px;height:26px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold);font-family:var(--serif)}
.option .txt{font-size:14.5px;line-height:1.7;padding-top:2px;color:#cfc9bd}
.quiz-foot{display:flex;align-items:center;margin-top:26px}
.link-btn{font-size:12px;color:var(--dim);letter-spacing:.2em;padding:6px 0;transition:.2s;visibility:hidden}
.link-btn.show{visibility:visible}
.link-btn:hover{color:var(--gold)}
.hint{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:.08em}

/* 结果屏 */
.result-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:16px}
.result-head b{color:var(--ink);font-weight:500}
.role-line{font-size:13px;color:var(--muted);letter-spacing:.1em;margin-bottom:14px}
.role-line b{color:var(--gold-hi);font-size:15px;font-weight:600;letter-spacing:.15em}
.result-card{border:1px solid var(--line-strong);background:linear-gradient(160deg,#171410 0%,#121214 62%);padding:26px;position:relative;margin-bottom:8px}
.result-card::before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,166,107,.1);pointer-events:none}
.result-top{display:flex;gap:22px;align-items:center}
.seal{width:82px;height:82px;border:2px solid var(--gold);position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 82px}
.seal::before{content:"";position:absolute;inset:4px;border:1px solid rgba(201,166,107,.5)}
.seal span{font-family:var(--serif);font-size:44px;color:var(--gold-hi);line-height:1}
.result-name{font-family:var(--serif);font-size:37px;letter-spacing:.14em;color:#efe6d3;margin:0;font-weight:600}
@media(max-width:640px){.result-name{font-size:29px}.seal{width:64px;height:64px;flex-basis:64px}.seal span{font-size:34px}}
.result-tag{margin-top:9px;color:var(--muted);font-size:13.5px;letter-spacing:.12em}
.quote-line{margin-top:22px;padding-top:18px;border-top:1px dashed rgba(201,166,107,.25);font-family:var(--serif);font-size:17px;color:var(--gold-hi);letter-spacing:.05em;line-height:1.75}
.section{margin:26px 2px 0}
.section h4{margin:0 0 10px;font-size:12px;letter-spacing:.32em;color:var(--gold);font-weight:500}
.section h4::before{content:"/// ";color:rgba(201,166,107,.4);letter-spacing:0}
.section p{margin:0;line-height:2.05;font-size:14.5px;color:#c9c3b7;text-align:justify}
.disclaimer{font-size:11.5px;color:var(--dim);margin-top:22px;line-height:1.8}
.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:10px;margin-top:22px}
@media(max-width:760px){.actions{grid-template-columns:1fr 1fr}}
.btn-ghost{border:1px solid rgba(255,255,255,.1);background:#121215;color:#cfc9bd;padding:13px 8px;font-size:13px;letter-spacing:.12em;transition:.2s}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--gold-hi)}
.actions .btn-primary{padding:13px 8px;text-indent:.12em;letter-spacing:.12em}

/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(5,5,6,.74);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.hidden{display:none}
.modal-panel{width:min(780px,94vw);max-height:84vh;overflow:auto;border:1px solid var(--line-strong);background:#101012;padding:26px 28px;position:relative}
.modal-title{font-family:var(--serif);letter-spacing:.25em;font-size:18px;color:var(--gold-hi);margin:0 0 18px}
.modal-close{position:absolute;right:12px;top:10px;font-size:18px;color:var(--dim);padding:4px 10px;line-height:1}
.modal-close:hover{color:var(--gold-hi)}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:720px){.gallery-grid{grid-template-columns:1fr 1fr}}
.g-item{border:1px solid rgba(255,255,255,.07);background:#141417;padding:13px;display:flex;gap:12px;align-items:center}
.g-item.current{border-color:var(--line-strong);background:#181510}
.g-seal{width:40px;height:40px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--gold-hi);flex:0 0 40px}
.g-name{font-size:14px;color:#e0d9cb;letter-spacing:.1em}
.g-tag{font-size:11px;color:var(--dim);margin-top:3px}
.g-flag{font-size:10px;color:var(--gold);border:1px solid var(--line);padding:0 4px;margin-left:6px;letter-spacing:.05em}
.record-row{display:flex;gap:14px;align-items:baseline;padding:12px 4px;border-bottom:1px dashed rgba(255,255,255,.06);font-size:13.5px}
.record-row .r-date{color:var(--dim);font-size:12px;flex:0 0 158px}
.record-row .r-name{color:var(--muted)}
.record-row .r-type{margin-left:auto;color:var(--gold-hi);letter-spacing:.1em}
.empty{color:var(--dim);font-size:13px;padding:26px 0;text-align:center;letter-spacing:.12em}
.clear-link{display:block;margin:18px auto 0;font-size:11px;color:var(--dim);letter-spacing:.15em}
.clear-link:hover{color:#b3574a}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="logo-card">
      <div class="logo-tag">同人复刻</div>
      <h1 class="logo">班味人格鉴定所</h1>
      <div class="logo-sub">BANWEI PERSONALITY LAB</div>
    </div>
    <div class="anniv-card">
      <div class="anniv-title">班味观测局</div>
      <div class="anniv-sub">17TH ANNIVERSARY</div>
    </div>
    <div class="specs">
      <div class="spec-row"><span>关卡</span><b>17</b></div>
      <div class="spec-row"><span>每题</span><b>A–C 三选一</b></div>
      <div class="spec-row"><span>耗时</span><b>视作答而定</b></div>
      <div class="spec-row"><span>记录</span><b>存于本机</b></div>
    </div>
    <button class="ghost wide" id="sideRecords">我的记录</button>
    <div class="holder"><span class="heart">♥</span> 持卡人 · <span id="sideName">待登记</span></div>
  </aside>
  <main class="main">
    <div class="panel">
      <div class="panel-head"><span class="dot"></span><span id="headLeft">登记中 · 本次模式</span><span class="head-right" id="headRight">START</span></div>
      <div class="panel-body" id="screen"></div>
      <div class="panel-foot">同人娱乐复刻 · 与任何公司无关 · 结果仅供娱乐</div>
    </div>
  </main>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-panel">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<canvas id="shareCanvas" class="hidden"></canvas>

<script>
"use strict";

/* ---------------- 人格数据 ---------------- */
const TYPES = {
  ddl: {
    name: "DDL 战士", seal: "燃",
    tagline: "死线一响，血脉觉醒",
    quote: "「给我一个截止日期，还你一个奇迹。」",
    file: "任务刚下发时你像一位与世无争的旁观者，进度条纹丝不动；日期一逼近，你突然进入超导状态，手指翻飞、思路通透，好像前面那些天都在为这一刻蓄能。不是拖延，是你的发动机只有一种点火方式。",
    art: "极限冲刺。越到最后关头越冷静，多线并行也不乱，爆发的时候你一个人就是一支队伍。",
    bill: "肾上腺素是借来的高利贷，睡眠是第一个被抵押的东西。第二天顶着黑眼圈解释「我其实想了很久」，你自己都差点信了。"
  },
  mor: {
    name: "早八永动机", seal: "启",
    tagline: "一杯咖啡，通关一整天",
    quote: "「别人靠意志力，我靠生物钟。」",
    file: "你是办公室里的晨间奇迹：八点整坐下，九点前已经干完别人一上午的量。咖啡只是仪式感，不是救命稻草，你的一天从清晨就已经领先半圈。",
    art: "早场爆发。脑子最清醒的两小时全留给了硬活，等别人下午开始犯困，你的结果已经晾在群里了。",
    bill: "晚上九点电量只剩一格，任何「晚上再说」的约定都接近失约。朋友以为你在敷衍，其实你只是真的困了。"
  },
  div: {
    name: "会议潜水员", seal: "潜",
    tagline: "全程静音，一句致命",
    quote: "「会开完了吧？那我来说结论。」",
    file: "一小时的会议，你发言不超过三十秒，但这三十秒往往决定后面三小时的方向。别人在争谁对谁错，你在等大家说累。",
    art: "观察与总结。你能从嘈杂里捞出真正的分歧点，一句话把跑偏的会拉回正轨。",
    bill: "沉默常被误读成没想法。到了述职那天，你要花双倍力气让大家想起：那些关键的一句，其实都是我说的。"
  },
  tab: {
    name: "表格美学家", seal: "齐",
    tagline: "对齐，是最低限度的体面",
    quote: "「数据可以难看，但不能不齐。」",
    file: "你的文件命名像军训，表格行高统一、字号克制、配色不超过三种。别人说你强迫症，你觉得那是职业尊严。",
    art: "结构化。再乱的信息到你的手里都会变成一张能跑的表，老板要什么口径，你三秒能筛出来。",
    bill: "你能为一个像素的偏差折腾半小时，却常在「大方向」上被催得手忙脚乱。精致是你的护城河，也是你的进度条。"
  },
  guo: {
    name: "接锅侠", seal: "揽",
    tagline: "有锅我背，有事我在",
    quote: "「放那儿吧，我来。」",
    file: "你是团队里永远在线的那个人。别人犹豫的活你顺手就接，别人搞砸的事你二话不说补上，连你自己都记不清今年替几个人救过火。",
    art: "托底。哪里漏风你就出现在哪里，项目有你在，大家睡觉都能踏实一点。",

  bnd: {
    name: "边界感大师", seal: "界",
    tagline: "下班即失联，明早再营业",
    quote: "「工作是为了生活，别搞反了。」",
    file: "你对上班投入，对下班更投入。六点一到，电脑合盖、群消息免打扰，世界瞬间安静。这不是躺平，是你把「自己」也列进了每日待办。",

    bill: "紧急时刻大家会习惯性跳过你，机会也是。你不是不知道，只是你算过了：用睡眠换来的表现，性价比并不高。"
  },
  std: {
    name: "情绪稳定器", seal: "定",
    tagline: "天塌下来，先喝口水",
    quote: "「慌不能加快进度，但会加快衰老。」",
    file: "上线炸了、需求翻了、老板急了，你是全屋唯一一个语速不变的人。先把水烧上，再把问题拆开，一件一件灭。",

    file: "你是工位区的温度计，也是团建的发动机。再陌生的会议室，只要你在，三句话就能把大家拧成一个群。",

    file: "你的浏览器永远留着几个与工作无关的标签页，你的表情看起来在深思，其实可能在想晚饭。但神奇的是，你交出来的东西总不太差。",

    bill: "关键时刻的「认真模式」需要启动时间，而这世界越来越不给热身的机会。松弛很珍贵，但要学会收放自如。"
  },
  fix: {
    name: "万能补位王", seal: "补",
    tagline: "哪里缺人，哪里就有我",
    quote: "「我可以不会，但我可以现在会。」",
    file: "前端缺人你顶前端，策划缺文案你顺手写，连打印机坏了都是你修的。你不是专业最深的那个，但一定是项目最离不开的那个。",
    art: "快速学习与补位。什么坑都能填，什么新工具到你手里，三天就能用。",
    bill: "样样通，也容易被当成样样松。你的名字很少出现在功劳簿第一行，却总在救火名单第一行。"
  },
  trn: {
    name: "甲方翻译官", seal: "译",

/* ---------------- 状态与存储 ---------------- */
const KEY_RECORDS = "banwei_lab_records_v1";
const KEY_NAME = "banwei_lab_name_v1";

const state = { idx: 0, answers: [], name: "无名打工人", lastType: null };

const $ = (id) => document.getElementById(id);
const screenEl = $("screen");
const headLeft = $("headLeft");
const headRight = $("headRight");
let currentScreen = "start";

function storeGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function storeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function loadName() {
  const n = storeGet(KEY_NAME, "");
  state.name = (typeof n === "string" && n.trim()) ? n.trim() : "无名打工人";
}
function loadRecords() {
  const r = storeGet(KEY_RECORDS, []);
  return Array.isArray(r) ? r : [];
}
function pushRecord(typeId) {
  const list = loadRecords();
  const now = new Date();
  list.unshift({
    t: now.toISOString(),
    name: state.name,
    type: typeId,
    mode: "标准模式"
  });
  storeSet(KEY_RECORDS, list.slice(0, 60));
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  const p = (x) => String(x).padStart(2, "0");
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------------- 计分 ---------------- */
function computeResult() {
  const score = {};
  TYPE_ORDER.forEach(k => score[k] = 0);
  state.answers.forEach(a => {
    const o = QUESTIONS[a.qi].opts[a.oi];
    score[o.p] += 3;
    score[o.s] += 1;
  });
  const last = state.answers.length ? QUESTIONS[state.answers[state.answers.length - 1].qi].opts[state.answers[state.answers.length - 1].oi] : null;
  const cand = TYPE_ORDER.map((k, i) => ({
    k, i, s: score[k],
    w: last ? (last.p === k ? 2 : (last.s === k ? 1 : 0)) : 0
  }));
  cand.sort((a, b) => b.s - a.s || b.w - a.w || a.i - b.i);
  return cand[0].k;
}

function startQuiz() {
  state.idx = 0;
  state.answers = [];

function renderQuestion() {
  currentScreen = "quiz";
  const i = state.idx;
  const q = QUESTIONS[i];
  setHead(`鉴定中 · 第 ${i + 1} 关`, `${i + 1} / ${QUESTIONS.length}`);
  screenEl.innerHTML = `
    <div class="quiz screen-anim">
      <div class="q-index">QUESTION ${String(i + 1).padStart(2, "0")}</div>
      <div class="progress"><i id="progBar"></i></div>

      <div class="options">
        ${q.opts.map((o, oi) => `
          <button class="option" data-oi="${oi}">

            <span class="txt">${o.t}</span>
          </button>`).join("")}
      </div>
      <div class="quiz-foot">
        <button class="link-btn ${i > 0 ? "show" : ""}" id="btnPrev">← 上一关</button>
        <span class="hint">按 A / B / C 或 1 / 2 / 3 快速作答</span>
      </div>
    </div>`;
  $("progBar").style.width = `${(i / QUESTIONS.length) * 100}%`;
  screenEl.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => chooseOption(parseInt(btn.dataset.oi, 10)));
  });
  const prev = $("btnPrev");
  if (prev) prev.addEventListener("click", () => {
    if (state.idx > 0) { state.idx--; state.answers.pop(); renderQuestion(); }
  });
}

function chooseOption(oi) {
  if (currentScreen !== "quiz") return;
  state.answers.push({ qi: state.idx, oi });
  state.idx++;
  if (state.idx >= QUESTIONS.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  const typeId = computeResult();
  state.lastType = typeId;
  pushRecord(typeId);
  renderResult();

/* ---------------- 复制文案 ---------------- */
function copyResultText() {
  const t = TYPES[state.lastType];
  const d = new Date();
  const p = (x) => String(x).padStart(2, "0");
  const text = `【班味人格鉴定所】\n本次角色：${t.name} —— ${t.tagline}\n${t.quote}\n持卡人：${state.name} · ${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}\n（同人复刻版，仅供娱乐）`;
  const done = () => {
    const btn = $("btnCopy");
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = "已复制 ✓";
    setTimeout(() => { btn.textContent = old; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

/* ---------------- 分享卡 ---------------- */
function drawShareCard() {
  const t = TYPES[state.lastType];
  const W = 750, H = 1180, DPR = 2;
  const cv = $("shareCanvas");
  cv.width = W * DPR; cv.height = H * DPR;
  const ctx = cv.getContext("2d");
  ctx.scale(DPR, DPR);

  const serif = '"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif';
  const sans = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#141210");
  bg.addColorStop(0.55, "#0d0d0f");
  bg.addColorStop(1, "#0a0a0b");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, 240, 40, W / 2, 240, 560);
  glow.addColorStop(0, "rgba(96,68,32,0.22)");
  glow.addColorStop(1, "rgba(96,68,32,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 双线边框
  ctx.strokeStyle = "#c9a66b";
  ctx.lineWidth = 2;
  ctx.strokeRect(40, 40, W - 80, H - 80);
  ctx.strokeStyle = "rgba(201,166,107,0.35)";
  ctx.lineWidth = 1;
  ctx.strokeRect(52, 52, W - 104, H - 104);

  ctx.textAlign = "center";

  // 页眉
  ctx.fillStyle = "#8e887c";
  ctx.font = `20px ${sans}`;
  letterSpaced(ctx, "BANWEI PERSONALITY LAB", W / 2, 112, 6);
  ctx.fillStyle = "#cfc7b8";
  ctx.font = `22px ${serif}`;
  letterSpaced(ctx, "班味人格鉴定所", W / 2, 152, 6);
  ctx.fillStyle = "#5c574f";
  ctx.font = `15px ${sans}`;
  letterSpaced(ctx, "同人复刻 · 17TH ANNIVERSARY SPECIAL", W / 2, 186, 3);

  // 印章
  const sx = W / 2 - 56, sy = 236, ss = 112;
  ctx.strokeStyle = "#c9a66b";
  ctx.lineWidth = 3;
  ctx.strokeRect(sx, sy, ss, ss);
  ctx.strokeStyle = "rgba(201,166,107,0.5)";
  ctx.lineWidth = 1;
  ctx.strokeRect(sx + 7, sy + 7, ss - 14, ss - 14);
  ctx.fillStyle = "#eed3a0";
  ctx.font = `64px ${serif}`;
  ctx.textBaseline = "middle";
  ctx.fillText(t.seal, W / 2, sy + ss / 2 + 4);
  ctx.textBaseline = "alphabetic";

  // 角色名
  ctx.fillStyle = "#8e887c";
  ctx.font = `16px ${sans}`;
  letterSpaced(ctx, "本 次 角 色", W / 2, 406, 4);

  const nameGrad = ctx.createLinearGradient(0, 420, 0, 480);
  nameGrad.addColorStop(0, "#f0d9a6");
  nameGrad.addColorStop(1, "#c39a58");
  ctx.fillStyle = nameGrad;
  ctx.font = `bold 58px ${serif}`;
  letterSpaced(ctx, t.name, W / 2, 474, 8);

  ctx.fillStyle = "#a49d90";
  ctx.font = `22px ${sans}`;
  letterSpaced(ctx, t.tagline, W / 2, 522, 2);

  // 分隔
  ctx.strokeStyle = "rgba(201,166,107,0.3)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(130, 566); ctx.lineTo(W - 130, 566); ctx.stroke();

  // 金句
  ctx.fillStyle = "#eed3a0";
  ctx.font = `26px ${serif}`;
  const quote = t.quote.replace(/^「|」$/g, "");
  wrapText(ctx, `「${quote}」`, W / 2, 620, 560, 44);

  // 档案摘要
  ctx.fillStyle = "#8e887c";
  ctx.font = `15px ${sans}`;
  letterSpaced(ctx, "V I B E S U M M A R Y", W / 2, 742, 4);
  ctx.fillStyle = "#bcb5a8";
  ctx.font = `19px ${sans}`;
  const summary = wrapText(ctx, t.bill, W / 2, 780, 540, 34);
  let y = 780 + (summary - 1) * 34 + 58;

  // 底部信息
  const d = new Date();
  const p = (x) => String(x).padStart(2, "0");
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.beginPath(); ctx.moveTo(130, y - 26); ctx.lineTo(W - 130, y - 26); ctx.stroke();

  ctx.fillStyle = "#8e887c";
  ctx.font = `18px ${sans}`;
  ctx.fillText(`持卡人 · ${state.name}`, W / 2, y + 6);
  ctx.fillStyle = "#5c574f";
  ctx.font = `16px ${sans}`;
  ctx.fillText(`${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} · 结果仅供娱乐`, W / 2, y + 40);
  ctx.fillText("班味人格鉴定所 · 同人复刻版", W / 2, H - 74);

  // 下载
  const a = document.createElement("a");
  a.download = `班味人格_${t.name.replace(/\s+/g, "")}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.png`;
  a.href = cv.toDataURL("image/png");
  a.click();
}
function letterSpaced(ctx, text, x, y, gap) {
  const chars = [...text];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (chars.length - 1);
  let cx = x - total / 2;
  chars.forEach((c, i) => {
    ctx.fillText(c, cx, y);
    cx += widths[i] + gap;
  });
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = [...text];
  let line = "";
  let lines = 0;
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, y + lines * lineHeight);
      lines++;
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y + lines * lineHeight); lines++; }
  return lines;
}

/* ---------------- 键盘 ---------------- */
document.addEventListener("keydown", (e) => {
  if (currentScreen !== "quiz") return;
  if (modal.classList.contains("hidden") === false) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  const map = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2 };
  const k = e.key.toLowerCase();
  if (k in map) chooseOption(map[k]);
  else if (e.key === "Backspace") {
    e.preventDefault();
    if (state.idx > 0) { state.idx--; state.answers.pop(); renderQuestion(); }
  }
});

/* ---------------- 启动 ---------------- */
loadName();
updateSideName();
renderStart();
</script>
